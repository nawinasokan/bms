{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Dashboard</h2>

<div class="row">
    <div class="col-md-3">
        <div class="card text-bg-primary shadow-sm">
            <div class="card-body">
                <h5>Customers</h5>
                <h3>{{ total_customers }}</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-success shadow-sm">
            <div class="card-body">
                <h5>Products</h5>
                <h3>{{ total_products }}</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-warning shadow-sm">
            <div class="card-body">
                <h5>Orders</h5>
                <h3>{{ total_orders }}</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-dark shadow-sm">
            <div class="card-body">
                <h5>Revenue</h5>
                <h3>{{ total_revenue }}</h3>
            </div>
        </div>
    </div>
</div>

<hr>

<div class="mt-3">
    <a class="btn btn-outline-primary" href="{% url 'customer_list' %}">Customers</a>
    <a class="btn btn-outline-success" href="{% url 'product_list' %}">Products</a>
    <a class="btn btn-outline-warning" href="{% url 'order_list' %}">Orders</a>
</div>
{% endblock %}
