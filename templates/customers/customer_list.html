{% extends 'base.html' %}

{% block content %}
<div class="d-flex align-items-center mb-3">
    <!-- Left -->
    <h2 class="mb-0">Customers</h2>

    <!-- Right -->
    <div class="ms-auto">
        <a class="btn btn-secondary me-2" href="{% url 'dashboard' %}">
            Home
        </a>
        <a class="btn btn-primary" href="{% url 'customer_add' %}">
            Add Customer
        </a>
    </div>
</div>


<table class="table table-striped table-hover mb-0">
    <thead class="table-dark">
        <tr>
            <th>S.no</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th width="180">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for customer in customers %}
        <tr>
            <td>{{ forloop.counter }} .</td>
            <td>{{ customer.name }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.email }}</td>
            <td>
                <a class="btn btn-sm btn-warning" href="{% url 'customer_edit' customer.id %}">Edit</a>
                <a class="btn btn-sm btn-danger" href="{% url 'customer_delete' customer.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
            <tr>
                <td colspan="5" class="text-center py-3">
                    No products found
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
